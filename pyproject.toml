[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu4pyscf-gau"
version = "0.1.0"
description = "Gaussian External geometry workflows backed by a persistent GPU4PySCF worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gpu-gau = "gpu4pyscf_gau.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
